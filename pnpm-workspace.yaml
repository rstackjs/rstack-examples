packages:
  - 'rspack/**'
  - 'rsbuild/**'
  - 'rslib/**'
  - 'rspress/**'
  - 'rsdoctor/**'
  - 'rstest/**'
  - '!**/dist'

dedupePeers: true

# Rstack products and official plugins only; other dependencies stay in package.json.
catalog:
  '@rsbuild/core': 2.2.12
  '@rsbuild/plugin-babel': ^2.1.0
  '@rsbuild/plugin-basic-ssl': ^2.0.0
  '@rsbuild/plugin-eslint': ^2.0.2
  '@rsbuild/plugin-less': ^2.0.1
  '@rsbuild/plugin-mdx': ^1.1.3
  '@rsbuild/plugin-preact': ^2.1.0
  '@rsbuild/plugin-react': ^2.1.1
  '@rsbuild/plugin-sass': ^2.0.1
  '@rsbuild/plugin-solid': ^1.2.2
  '@rsbuild/plugin-styled-components': ^1.7.0
  '@rsbuild/plugin-svelte': ^2.0.1
  '@rsbuild/plugin-tailwindcss': ^2.0.3
  '@rsbuild/plugin-umd': ^1.0.7
  '@rsbuild/plugin-vue': ^2.0.1
  '@rsdoctor/rspack-plugin': ^1.6.5
  '@rslib/core': ^1.0.3
  '@rspack/cli': 2.2.8
  '@rspack/core': 2.2.8
  '@rspack/dev-server': 2.2.1
  '@rspack/plugin-preact-refresh': ^2.0.1
  '@rspack/plugin-react-refresh': ^2.0.2
  '@rspress/core': ^2.0.23
  '@rspress/plugin-api-docgen': ^2.0.23
  '@rspress/plugin-preview': ^2.0.23
  '@rstest/adapter-rsbuild': ^0.12.3
  '@rstest/adapter-rslib': ^0.12.3
  '@rstest/adapter-rspack': ^0.12.3
  '@rstest/browser': ^0.12.3
  '@rstest/browser-react': ^0.12.3
  '@rstest/core': ^0.12.3
  '@rstest/coverage-istanbul': ^0.12.3
  '@rstest/playwright': ^0.12.3
  eslint-rspack-plugin: ^5.0.1
  rspack-manifest-plugin: 5.2.2
  rspack-vue-loader: ^17.7.0
  rstack: ^0.8.3
  storybook-addon-rslib: ^3.6.1
  storybook-react-rsbuild: ^3.6.1
  storybook-vue3-rsbuild: ^3.6.1
  ts-checker-rspack-plugin: ^1.7.1
  worker-rspack-loader: ^3.1.5

# Preserve the existing Rstack ranges used by a subset of examples.
catalogs:
  alternate:
    '@rsbuild/core': ^2.2.12
    '@rsbuild/plugin-react': 2.1.1
    '@rsbuild/plugin-solid': ^2.0.0-rc.1
    rspack-manifest-plugin: ^5.2.2
  rsbuild-tilde:
    '@rsbuild/core': ~2.2.12
