name: CI

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

  pull_request:

  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        id: pnpm-install

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter @rstest-example/browser-locator exec playwright install --with-deps chromium

      - name: Build Rspack
        run: |
          pnpm build:rspack

      - name: Build Rsbuild
        run: |
          pnpm build:rsbuild

      - name: Build Rslib
        run: |
          pnpm build:rslib

      - name: Build Rspress
        run: |
          pnpm build:rspress

      - name: Build Rsdoctor
        run: |
          pnpm build:rsdoctor

      - name: Test Rstest
        run: pnpm test:rstest
